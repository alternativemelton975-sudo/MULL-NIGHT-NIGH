<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MULL NIGHT NIGH</title>
  <style>
    :root {
      --bg: #0a1025;
      --panel: rgba(12, 18, 34, 0.86);
      --panel-border: rgba(148, 163, 184, 0.35);
      --accent: #67e8f9;
      --accent-2: #fbbf24;
      --text: #ebf3ff;
      --muted: #cbd5e1;
      --shadow: rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(103, 232, 249, 0.16), transparent 35%),
        linear-gradient(180deg, #090d17 0%, #111827 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-shell {
      width: min(94vw, 1040px);
      display: grid;
      grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
      gap: 22px;
      align-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .story-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 22px 18px;
      min-height: 440px;
    }

    .tag {
      margin: 0 0 12px;
      letter-spacing: 0.18em;
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 2vw + 1rem, 3rem);
      line-height: 1.1;
    }

    #storyText {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
      min-height: 110px;
    }

    .objective {
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(103, 232, 249, 0.08);
      border: 1px solid rgba(103, 232, 249, 0.3);
      color: var(--text);
      font-weight: 700;
    }

    .game-area {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 440px;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(14, 20, 38, 0.9), rgba(9, 12, 21, 0.9)),
        radial-gradient(circle at 50% 15%, rgba(250, 204, 21, 0.18), transparent 28%);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.35);
    }

    .game-area::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,0.7) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,255,255,0.8) 0 1px, transparent 1.7px);
      background-size: 120px 120px, 180px 180px, 160px 160px;
      background-position: 30px 25px, 120px 120px, 220px 80px;
      opacity: 0.7;
    }

    .skyline {
      position: absolute;
      inset: auto 0 0 0;
      height: 120px;
      background:
        linear-gradient(180deg, rgba(96, 165, 250, 0.12), rgba(88, 28, 135, 0.2)),
        repeating-linear-gradient(
          90deg,
          rgba(15, 23, 42, 0.92) 0,
          rgba(15, 23, 42, 0.92) 18px,
          rgba(30, 41, 59, 0.9) 18px,
          rgba(30, 41, 59, 0.9) 36px
        );
      border-top: 2px solid rgba(103, 232, 249, 0.2);
    }

    .gate {
      position: absolute;
      right: 58px;
      top: 150px;
      width: 80px;
      height: 120px;
      border: 3px solid rgba(103, 232, 249, 0.5);
      border-radius: 18px 18px 24px 24px;
      background: rgba(15, 118, 110, 0.12);
      box-shadow: 0 0 26px rgba(103, 232, 249, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .gate::before {
      content: "";
      position: absolute;
      inset: 12px 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
    }

    .gate.open {
      border-color: rgba(251, 191, 36, 0.9);
      box-shadow: 0 0 34px rgba(251, 191, 36, 0.44);
      transform: scale(1.04);
      background: rgba(251, 191, 36, 0.11);
    }

    .moon-shard {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef3c7, #fbbf24 45%, #f59e0b 100%);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.9);
      transform: rotate(30deg);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .moon-shard.collected {
      opacity: 0;
      transform: scale(0.1);
    }

    .player {
      position: absolute;
      left: 54px;
      top: 300px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #dbeafe 0%, #60a5fa 45%, #1d4ed8 100%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 0 18px rgba(96, 165, 250, 0.75);
      z-index: 2;
    }

    .player::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -8px;
      width: 12px;
      height: 12px;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
    }

    .message-overlay {
      position: absolute;
      inset: auto 16px 16px 16px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.72);
      border: 1px solid rgba(103, 232, 249, 0.3);
      color: var(--text);
      text-align: center;
      font-weight: 700;
      z-index: 3;
      transition: opacity 0.25s ease;
    }

    .message-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .game-shell {
        grid-template-columns: 1fr;
      }

      .story-panel {
        min-height: auto;
      }

      .game-area {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <aside class="story-panel">
      <p class="tag">Moonlit tale</p>
      <h1>MULL NIGHT NIGH</h1>
      <p id="storyText">Mull wakes beneath a broken moon and hears the old gate hum in the distance.</p>
      <div id="objective" class="objective">Objective: Find the 3 moon shards.</div>
    </aside>

    <div id="gameArea" class="game-area" aria-label="Mull Night Nigh game field">
      <div class="skyline"></div>
      <div id="gate" class="gate" aria-label="Ancient gate"></div>
      <div class="moon-shard" style="left: 120px; top: 120px;"></div>
      <div class="moon-shard" style="left: 300px; top: 80px;"></div>
      <div class="moon-shard" style="left: 490px; top: 230px;"></div>
      <div id="player" class="player" aria-label="Player character"></div>
      <div id="messageOverlay" class="message-overlay">Use WASD to move</div>
    </div>
  </div>

  <script src="MULL-NIGHT-NIGH.js"></script>
</body>
</html>
